name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Postavi JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Release potpisivanje traži keystore.properties, koji nije u repozitorijumu;
      # debug varijanta se potpisuje debug ključem, pa CI ne treba tajne.
      - name: Testovi
        run: ./gradlew :app:testGooglePlayDebugUnitTest --no-daemon

      - name: Build debug APK-a
        run: ./gradlew :app:assembleGooglePlayDebug --no-daemon

      - name: Sačuvaj izveštaj o testovima
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
